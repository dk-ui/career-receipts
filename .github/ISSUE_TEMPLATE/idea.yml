name: Idea
description: Something that would make the vault more useful.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: The situation, like "prepping my annual review", not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real personal or employer details.
          required: true
